# investing-index config
# Dense retrieval plus BM25 and RRF.

embedding:
  model: "IEITYuan/Yuan-embedding-2.0-en"
  dim: 1024
  batch_size: 32
  device: "cpu"

# The reranker model is loaded by the embed daemon; top_k is how many fused
# chunks it scores per question.
reranker:
  enabled: false
  top_k: 25

chunking:
  max_chars: 1500
  overlap_chars: 200

bm25:
  k1: 1.5
  b: 0.75

rrf:
  k: 60

search:
  top_k: 20
  snippet_chars: 300

index:
  data_dir: "~/.investing-index"
  exclude_dirs:
    - "logbook"
    - "scripts"
    - ".github"
    - ".git"
  exclude_patterns:
    - "*.json"
    - "*.yaml"
    - "*.yml"

ppr:
  enabled: false
  alpha: 0.85
  max_iter: 50

freshness:
  warn_hours: 24
